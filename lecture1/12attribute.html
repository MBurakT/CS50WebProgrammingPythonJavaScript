<!DOCTYPE html>
<html>

<head lang="en">
    <title>Attribute</title>
    <style>
        a {
            color: blue;
        }

        a[href="https://www.facebook.com"] {
            color: red;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="https://www.google.com">Google</li>
        <li><a href="https://www.facebook.com">Facebook</li>
        <li><a href="https://www.amazon.com">Amazon</li>
    </ul>
</body>

</html>
